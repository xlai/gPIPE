# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# gPIPE requires R >= 4.4. R-devel runs as an early warning and does not block.
on:
  push:
    branches: [main, dev]
  # every PR, including stacked PRs whose base is a feature branch
  pull_request:
  schedule:
    # weekly, Monday 06:00 UTC, so changes in R-devel surface early
    - cron: '0 6 * * 1'
  workflow_dispatch:

name: R-CMD-check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    continue-on-error: ${{ matrix.config.experimental }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release', experimental: false}
          - {os: windows-latest, r: 'release', experimental: false}
          - {os: ubuntu-latest,  r: 'devel',   experimental: true, http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release', experimental: false}
          - {os: ubuntu-latest,  r: 'oldrel-1', experimental: false}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
